<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Админ-панель — IT-поддержка</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <span class="navbar-brand"><i class="bi bi-shield-lock"></i> Админ-панель</span>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="index.html">На сайт</a>
    </div>
  </div>
</nav>

<div class="container my-4">
  <div class="card shadow-sm">
    <div class="card-body">
      <h1 class="h4 mb-3">Список заявок</h1>
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>ID</th>
              <th>Тема</th>
              <th>Категория</th>
              <th>Срочность</th>
              <th>Исполнитель</th>
              <th>Статус</th>
              <th>Действие</th>
            </tr>
          </thead>
          <tbody id="ticketsTableBody">
            <tr><td colspan="7" class="text-center text-muted">Загрузка...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
// ВАЖНО: Замените URL на ссылки ваших функций!
const GET_ALL_URL = 'https://functions.yandexcloud.net/d4encghgeriphl6r1pe4';
const UPDATE_URL = 'https://functions.yandexcloud.net/d4e0ctdp66rgbkfn3nmb';

async function loadTickets() {
  try {
    const response = await fetch(GET_ALL_URL);
    const tickets = await response.json();
    renderTickets(tickets);
  } catch (e) {
    console.error(e);
    alert('Ошибка загрузки заявок');
  }
}

function renderTickets(tickets) {
  const tbody = document.getElementById('ticketsTableBody');
  if (!tickets || tickets.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">Заявок пока нет</td></tr>';
    return;
  }

  tbody.innerHTML = tickets.map(t => `
    <tr>
      <td><code>${t.ticket_id}</code></td>
      <td>${t.subject}</td>
      <td>${t.category}</td>
      <td>${t.urgency}</td>
      <td>${t.assignee}</td>
      <td><span class="badge ${statusClass(t.status)}">${t.status}</span></td>
      <td>
        <select class="form-select form-select-sm" onchange="updateStatus('${t.ticket_id}', this.value)">
          <option value="" disabled selected>Изменить...</option>
          <option value="в работе">В работу</option>
          <option value="на проверке">На проверку</option>
          <option value="закрыта">Закрыть</option>
        </select>
      </td>
    </tr>
  `).join('');
}

async function updateStatus(ticketId, newStatus) {
  if (!newStatus) return;
  try {
    const response = await fetch(UPDATE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ticket_id: ticketId, status: newStatus })
    });
    if (response.ok) {
      loadTickets(); // Перезагружаем таблицу
    } else {
      alert('Ошибка обновления');
    }
  } catch (e) {
    console.error(e);
    alert('Ошибка сети');
  }
}

function statusClass(status) {
  switch (status) {
    case 'новая': return 'bg-secondary';
    case 'назначена': return 'bg-primary';
    case 'в работе': return 'bg-warning text-dark';
    case 'на проверке': return 'bg-info text-dark';
    case 'закрыта': return 'bg-success';
    case 'эскалирована': return 'bg-danger';
    default: return 'bg-secondary';
  }
}

// Загружаем данные при открытии страницы
document.addEventListener('DOMContentLoaded', loadTickets);
</script>

</body>
</html>
