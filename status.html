<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Проверить статус заявки — IT-поддержка</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-headset"></i> IT-поддержка
      </a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="index.html">Оставить заявку</a>
        <a class="nav-link active" href="status.html">Проверить статус</a>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-lg-7">

        <!-- Форма поиска -->
        <div class="card shadow-sm mb-4">
          <div class="card-body p-4">
            <h1 class="h3 mb-3">Проверить статус заявки</h1>
            <p class="text-muted mb-4">
              Введите номер заявки, который вы получили при создании.
            </p>

            <form id="statusForm" class="row g-2">
              <div class="col-md-8">
                <input type="text" class="form-control form-control-lg"
                       id="ticketId" placeholder="Например, SD-000123" required>
              </div>
              <div class="col-md-4 d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                  <i class="bi bi-search"></i> Найти
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- Результат поиска (скрыт по умолчанию) -->
        <div class="card shadow-sm d-none" id="resultCard">
          <div class="card-body p-4">

            <div class="d-flex justify-content-between align-items-start mb-3">
              <div>
                <div class="text-muted small">Заявка</div>
                <div class="h4 mb-0" id="resTicketId">SD-000000</div>
              </div>
              <span class="badge bg-secondary fs-6" id="resStatus">новая</span>
            </div>

            <hr>

            <dl class="row mb-0">
              <dt class="col-sm-4 text-muted">Тема</dt>
              <dd class="col-sm-8" id="resSubject">—</dd>

              <dt class="col-sm-4 text-muted">Категория</dt>
              <dd class="col-sm-8" id="resCategory">—</dd>

              <dt class="col-sm-4 text-muted">Срочность</dt>
              <dd class="col-sm-8" id="resUrgency">—</dd>

              <dt class="col-sm-4 text-muted">Исполнитель</dt>
              <dd class="col-sm-8" id="resAssignee">—</dd>

              <dt class="col-sm-4 text-muted">Создана</dt>
              <dd class="col-sm-8" id="resCreated">—</dd>

              <dt class="col-sm-4 text-muted">Срок решения (SLA)</dt>
              <dd class="col-sm-8" id="resSla">—</dd>
            </dl>

          </div>
        </div>

        <!-- Сообщение «не найдено» -->
        <div class="alert alert-warning d-none" id="notFound">
          <i class="bi bi-exclamation-triangle"></i>
          Заявка с таким номером не найдена. Проверьте номер и попробуйте снова.
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/status.js"></script>
</body>
</html>
